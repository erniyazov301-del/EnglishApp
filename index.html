<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linguist Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #ffffff;
            --text: #1a1a1a;
            --accent: #007aff;
            --subtle: #f5f5f7;
            --border: #e5e5e7;
            --success: #34c759;
            --error: #ff3b30;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            margin: 0;
        }

        header {
            padding: 2rem 1rem;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        nav button {
            background: none;
            border: none;
            cursor: pointer;
            font-weight: 500;
            color: #86868b;
            margin-left: 1.5rem;
            padding: 5px 0;
        }

        nav button.active { color: var(--text); border-bottom: 2px solid var(--text); }

        main { flex: 1; max-width: 700px; margin: 0 auto; width: 100%; padding: 1rem; }

        .card {
            background: var(--subtle);
            border-radius: 16px;
            padding: 2.5rem;
            margin-top: 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            margin: 1.5rem 0;
            font-size: 1.1rem;
            outline: none;
            text-align: center;
        }

        button.primary {
            background: var(--text);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.1s;
        }

        button.primary:active { transform: scale(0.98); }

        .hint-box {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-top: 1rem;
            font-size: 0.9rem;
            display: none;
            text-align: left;
        }

        .translation {
            font-size: 1.5rem;
            color: var(--accent);
            margin: 1rem 0;
            display: none;
        }

        .hidden { display: none; }
        .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin: 1rem 0; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--accent); transition: width 0.3s; }
    </style>
</head>
<body>

<header id="main-nav" class="hidden">
    <div style="font-weight: 600; font-size: 1.3rem;">Linguist</div>
    <nav>
        <button onclick="showSection('test')" id="nav-test">Tests</button>
        <button onclick="showSection('cards')" id="nav-cards">Cards</button>
    </nav>
</header>

<main>
    <section id="setup-screen" class="card">
        <h2>Настройка обучения</h2>
        <p style="color: #86868b; margin-bottom: 2rem;">Выберите ваш уровень и предпочтения</p>
        <select id="user-level" style="width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 1rem;">
            <option value="A1">A1 - Начальный</option>
            <option value="B1">B1 - Средний</option>
            <option value="C1">C1 - Продвинутый</option>
        </select>
        <select id="user-font" style="width: 100%; padding: 12px; border-radius: 8px; margin-bottom: 2rem;">
            <option value="16px">Обычный шрифт</option>
            <option value="20px">Крупный шрифт</option>
        </select>
        <button class="primary" onclick="saveSetup()">Начать учиться</button>
    </section>

    <section id="test-section" class="hidden">
        <div class="progress-bar"><div id="test-progress" class="progress-fill"></div></div>
        <p id="test-counter" style="font-size: 0.85rem; color: #86868b;"></p>
        <div class="card">
            <h3 id="target-sentence" style="font-size: 1.4rem;"></h3>
            <input type="text" id="test-input" placeholder="Введите перевод на английский..." autocomplete="off">
            <div id="feedback" style="margin-bottom: 1rem; font-weight: 600;"></div>
            <div id="grammar-hint" class="hint-box"></div>
            <button id="check-btn" class="primary" onclick="checkAnswer()">Проверить</button>
        </div>
    </section>

    <section id="cards-section" class="hidden">
        <div class="card">
            <p style="font-size: 0.9rem; color: #86868b;">Как это переводится?</p>
            <h2 id="card-word" style="font-size: 3rem; margin: 1.5rem 0;">Word</h2>
            <div id="card-translation" class="translation">Перевод</div>
            <div style="display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 2rem;">
                <button id="show-translate-btn" onclick="showTranslation()" style="background: none; border: 1px solid var(--border); padding: 10px 20px; border-radius: 8px; cursor: pointer;">Посмотреть перевод</button>
                <div id="card-controls" class="hidden" style="display: flex; gap: 10px; width: 100%; justify-content: center;">
                    <button onclick="nextCard(false)" style="flex: 1; padding: 12px; border-radius: 8px; border: 1px solid var(--border); cursor: pointer;">Повторить</button>
                    <button onclick="nextCard(true)" class="primary" style="flex: 1;">Знаю</button>
                </div>
            </div>
        </div>
    </section>
</main>

<script>
    const data = {
        A1: {
            sentences: [
                {q: "Я пью кофе каждое утро", a: "I drink coffee every morning", hint: "<b>Present Simple:</b> Используется для регулярных действий. Глагол остается в начальной форме для 'I'."},
                {q: "У неё есть машина", a: "She has a car", hint: "<b>Have/Has:</b> Для третьего лица (he, she, it) мы используем 'has'."}
            ],
            words: [
                {en: "Substance", ru: "Вещество"},
                {en: "Solution", ru: "Раствор"},
                {en: "Research", ru: "Исследование"}
            ]
        },
        B1: {
            sentences: [
                {q: "Я работаю здесь уже пять лет", a: "I have been working here for five years", hint: "<b>Present Perfect Continuous:</b> Используется для действий, которые начались в прошлом и продолжаются до сих пор."}
            ],
            words: [
                {en: "Analyze", ru: "Анализировать"},
                {en: "Consistent", ru: "Последовательный"}
            ]
        }
    };

    let state = { level: 'A1', testIndex: 0, cardIndex: 0 };

    window.onload = () => {
        const saved = localStorage.getItem('linguist_v2');
        if (saved) {
            state = JSON.parse(saved);
            applySettings();
            showSection('test');
        }
    };

    function saveSetup() {
        state.level = document.getElementById('user-level').value;
        document.body.style.fontSize = document.getElementById('user-font').value;
        localStorage.setItem('linguist_v2', JSON.stringify(state));
        applySettings();
        showSection('test');
    }

    function applySettings() {
        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('main-nav').classList.remove('hidden');
        loadTest();
        loadCard();
    }

    function showSection(name) {
        ['test', 'cards'].forEach(s => {
            document.getElementById(`${s}-section`).classList.add('hidden');
            document.getElementById(`nav-${s}`).classList.remove('active');
        });
        document.getElementById(`${name}-section`).classList.remove('hidden');
        document.getElementById(`nav-${name}`).classList.add('active');
    }

    function loadTest() {
        const levelData = data[state.level] || data['A1'];
        const current = levelData.sentences[state.testIndex % levelData.sentences.length];
        document.getElementById('target-sentence').innerText = current.q;
        document.getElementById('test-counter').innerText = `Предложение ${state.testIndex + 1} / 500`;
        document.getElementById('test-progress').style.width = `${((state.testIndex + 1) / 500) * 100}%`;
        document.getElementById('grammar-hint').style.display = 'none';
        document.getElementById('feedback').innerText = "";
    }

    function checkAnswer() {
        const input = document.getElementById('test-input').value.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
        const levelData = data[state.level] || data['A1'];
        const current = levelData.sentences[state.testIndex % levelData.sentences.length];
        const correct = current.a.toLowerCase().replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").trim();
        
        const feedback = document.getElementById('feedback');
        const hintBox = document.getElementById('grammar-hint');

        if (input === correct) {
            feedback.style.color = 'var(--success)';
            feedback.innerText = "Правильно!";
            hintBox.innerHTML = current.hint;
            hintBox.style.display = 'block';
            
            setTimeout(() => {
                state.testIndex++;
                document.getElementById('test-input').value = "";
                localStorage.setItem('linguist_v2', JSON.stringify(state));
                loadTest();
            }, 3500);
        } else {
            feedback.style.color = 'var(--error)';
            feedback.innerText = `Не совсем. Верно: ${current.a}`;
        }
    }

    function loadCard() {
        const levelData = data[state.level] || data['A1'];
        const current = levelData.words[state.cardIndex % levelData.words.length];
        document.getElementById('card-word').innerText = current.en;
        document.getElementById('card-translation').innerText = current.ru;
        document.getElementById('card-translation').style.display = 'none';
        document.getElementById('show-translate-btn').style.display = 'block';
        document.getElementById('card-controls').classList.add('hidden');
    }

    function showTranslation() {
        document.getElementById('card-translation').style.display = 'block';
        document.getElementById('show-translate-btn').style.display = 'none';
        document.getElementById('card-controls').classList.remove('hidden');
    }

    function nextCard(know) {
        state.cardIndex++;
        localStorage.setItem('linguist_v2', JSON.stringify(state));
        loadCard();
    }
</script>
</body>
</html>
